// ==================== シードRNG ====================
function createRNG(seed){ let s=seed|0; return{next(){ s|=0; s=s+0x6D2B79F5|0; let t=Math.imul(s^s>>>15,1|s); t=t+Math.imul(t^t>>>7,61|t)^t; return((t^t>>>14)>>>0)/4294967296; }}; }
function shuffle(arr,rng){ const r=[...arr]; for(let i=r.length-1;i>0;i--){ const j=Math.floor(rng.next()*(i+1)); [r[i],r[j]]=[r[j],r[i]]; } return r; }

// ==================== 日替わりシード ====================
function getDailySeed() {
  const now = new Date();
  const dateStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
  let hash = 0;
  for (let i = 0; i < dateStr.length; i++) { hash = ((hash << 5) - hash) + dateStr.charCodeAt(i); hash |= 0; }
  return Math.abs(hash) % 2147483647;
}

// ==================== 盤面生成 ====================
function isValidPlacement(g,r,c,n){ const D=[[-1,0],[1,0],[0,-1],[0,1]]; for(const[dr,dc]of D){ const nr=r+dr,nc=c+dc; if(nr>=0&&nr<SIZE&&nc>=0&&nc<SIZE&&g[nr][nc]!==null){ const d=Math.abs(n-g[nr][nc]); if(d<1||d>5)return false; } } return true; }
function generateRandomGrid(rng){ const g=Array.from({length:SIZE},()=>Array(SIZE).fill(null)); function bt(p){ if(p===SIZE*SIZE)return true; const r=Math.floor(p/SIZE),c=p%SIZE; for(const n of shuffle(NUMBERS,rng)){ if(isValidPlacement(g,r,c,n)){ g[r][c]=n; if(bt(p+1))return true; g[r][c]=null; } } return false; } bt(0); return g; }
function extractHints(s){ const h=[]; for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++){ if(r<SIZE-1)h.push({r1:r,c1:c,r2:r+1,c2:c,diff:Math.abs(s[r][c]-s[r+1][c])}); if(c<SIZE-1)h.push({r1:r,c1:c,r2:r,c2:c+1,diff:Math.abs(s[r][c]-s[r][c+1])}); } return h; }
function getRowDiffSequence(g,r){ const s=[]; for(let c=0;c<SIZE-1;c++)s.push((g[r][c]!==null&&g[r][c+1]!==null)?Math.abs(g[r][c]-g[r][c+1]):null); return s; }
function getColDiffSequence(g,c){ const s=[]; for(let r=0;r<SIZE-1;r++)s.push((g[r][c]!==null&&g[r+1][c]!==null)?Math.abs(g[r][c]-g[r+1][c]):null); return s; }

// ==================== ソルバー ====================
function solveWithEvents(fixed,hints){
  const grid=Array.from({length:SIZE},()=>Array(SIZE).fill(null));
  const filled=Array.from({length:SIZE},()=>Array(SIZE).fill(false));
  for(const[k,v]of Object.entries(fixed)){ const[r,c]=k.split(',').map(Number); grid[r][c]=v; filled[r][c]=true; }
  let solutions=0,steps=0,maxChain=0,curChain=0,t3E=[],t1E=[],chainE=[];
  function getCands(r,c){ const R=[]; for(const n of NUMBERS){ let ok=true; for(const h of hints)if((h.r1===r&&h.c1===c)||(h.r2===r&&h.c2===c)){ const o=h.r1===r?h.r2:h.r1,o2=h.c1===c?h.c2:h.c1; if(grid[o][o2]!==null&&Math.abs(n-grid[o][o2])!==h.diff){ok=false;break;} } if(ok)R.push(n); } return R; }
  function getConstraintCands(r,c){ const R=[]; for(const h of hints)if((h.r1===r&&h.c1===c)||(h.r2===r&&h.c2===c)){ const o=h.r1===r?h.r2:h.r1,o2=h.c1===c?h.c2:h.c1; if(grid[o][o2]!==null){ const C=[]; for(const n of NUMBERS)if(Math.abs(n-grid[o][o2])===h.diff)C.push(n); R.push(C); } } return R; }
  function isT1(r,c){ const val=grid[r][c]; if(val!==1&&val!==6)return false; for(const h of hints)if((h.r1===r&&h.c1===c)||(h.r2===r&&h.c2===c)){ const o=h.r1===r?h.r2:h.r1, o2=h.c1===c?h.c2:h.c1; if(grid[o][o2]!==null&&h.diff===5)return true; } return false; }
  function propagate(){ let ch=true,l=0; while(ch&&l<40){ ch=false;l++; const tF=[],t3F=[]; for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++){ if(filled[r][c])continue; const aC=getCands(r,c); if(aC.length===1){ const cC=getConstraintCands(r,c); let sS=cC.some(c=>c.length===1); if(!sS&&cC.length>=2)t3F.push({r,c,num:aC[0]}); else tF.push({r,c,num:aC[0]}); } }
      for(const{r,c,num}of t3F){ grid[r][c]=num;filled[r][c]=true;ch=true;curChain++;t3E.push({r,c,num,step:steps});if(curChain>maxChain)maxChain=curChain; }
      for(const{r,c,num}of tF){ grid[r][c]=num;filled[r][c]=true;ch=true;curChain++; if(isT1(r,c))t1E.push({r,c,num,step:steps}); if(curChain>maxChain)maxChain=curChain; }
      if(t3F.length+tF.length>0){ chainE.push({step:steps,count:t3F.length+tF.length,t3:t3F.length}); steps++; }else curChain=0; } }
  function backtrack(pos){ if(pos===SIZE*SIZE){solutions++;return;} const r=Math.floor(pos/SIZE),c=pos%SIZE; if(filled[r][c]){backtrack(pos+1);return;} for(const n of getCands(r,c)){ grid[r][c]=n;filled[r][c]=true;backtrack(pos+1);grid[r][c]=null;filled[r][c]=false;if(solutions>1)return; } }
  propagate();backtrack(0);
  return{solutions,steps,chainEvents:chainE,t3Events:t3E,t1Events:t1E,maxChainLength:maxChain,totalFilled:filled.flat().filter(v=>v).length};
}
function evaluatePuzzle(sol,fixed,hints){
  const res=solveWithEvents(fixed,hints); const tc=SIZE*SIZE,fc=Object.keys(fixed).length;
  const tfp=tc-fc-res.steps,cd=res.steps>0?tfp/res.steps:0, t3=res.t3Events.length,t1=res.t1Events.length;
  let ts=1.0; if(t3>0){ const p=res.steps>0?res.t3Events[0].step/res.steps:0.5; ts=Math.min(1,Math.max(0,1-Math.abs(p-0.5)*4)); }
  const score=Math.max(0,Math.min(1,(tc>fc?(tc-fc-res.steps)/(tc-fc):1)*0.30+cd*0.20+Math.min(1,t3)*0.15+ts*0.15+Math.min(1,res.maxChainLength/7)*0.10+(1/(fc+1))*0.05+Math.min(1,(t1+t3)/Math.max(1,res.steps*0.5))*0.05));
  return{score,metrics:{chainDensity:cd,t3Count:t3,t3TimingScore:ts,maxChainScore:Math.min(1,res.maxChainLength/7),fixedScore:1/(fc+1),techBalance:Math.min(1,(t1+t3)/Math.max(1,res.steps*0.5)),diversity:new Set([t1>0?'T1':'',t3>0?'T3':'',res.steps>0?'chain':'',res.solutions===1?'unique':''].filter(Boolean)).size/4,steps:res.steps,maxChainLength:res.maxChainLength,t1Count:t1,solutions:res.solutions,fixedCount:fc,propagateCompleteRate:tc>fc?(tc-fc-res.steps)/(tc-fc):1},result:res};
}

// ==================== Web Worker ====================
const workerCode = `
  const SIZE=5, NUMBERS=[1,2,3,4,5,6], TARGET_SCORE=0.60;
  const DIFFICULTY_TABLE=${JSON.stringify(DIFFICULTY_TABLE)};
  function createRNG(seed){ let s=seed|0; return{next(){ s|=0; s=s+0x6D2B79F5|0; let t=Math.imul(s^s>>>15,1|s); t=t+Math.imul(t^t>>>7,61|t)^t; return((t^t>>>14)>>>0)/4294967296; }}; }
  function shuffle(arr,rng){ const r=[...arr]; for(let i=r.length-1;i>0;i--){ const j=Math.floor(rng.next()*(i+1)); [r[i],r[j]]=[r[j],r[i]]; } return r; }
  ${isValidPlacement.toString()}
  ${generateRandomGrid.toString()}
  ${extractHints.toString()}
  ${getRowDiffSequence.toString()}
  ${getColDiffSequence.toString()}
  ${solveWithEvents.toString()}
  ${evaluatePuzzle.toString()}
  function generatePuzzleDeterministic(level,seed){
    const cfg=DIFFICULTY_TABLE[level],rng=createRNG(seed);
    const sol=generateRandomGrid(rng),hints=extractHints(sol);
    const allPos=[]; for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++)allPos.push([r,c]);
    const shuf=shuffle(allPos,rng).slice(0,cfg.fixedCount);
    const fixed={}; shuf.forEach(([r,c])=>{fixed[\`\${r},\${c}\`]=sol[r][c];});
    const ev=evaluatePuzzle(sol,fixed,hints),rate=ev.metrics.propagateCompleteRate||0;
    if(ev.result.solutions===1&&ev.score>=TARGET_SCORE&&rate>=cfg.rateMin&&rate<cfg.rateMax)
      return{solution:sol,fixed,hints,score:ev.score,metrics:ev.metrics,propagateRate:rate,fixedCount:cfg.fixedCount,seed};
    return null;
  }
  onmessage = function(e) {
    const {level,seed,requestId}=e.data;
    let puzzle=null, finalSeed=seed;
    for(let retry=0;retry<300;retry++){
      finalSeed=seed+retry;
      puzzle=generatePuzzleDeterministic(level,finalSeed);
      if(puzzle)break;
    }
    postMessage({requestId,puzzle,seed:finalSeed});
  };
`;
const workerBlob = new Blob([workerCode], {type:'application/javascript'});
const workerUrl = URL.createObjectURL(workerBlob);
const generatorWorker = new Worker(workerUrl);
let workerRequestId = 0;
const workerCallbacks = {};
generatorWorker.onmessage = function(e) {
  const {requestId, puzzle, seed} = e.data;
  if (workerCallbacks[requestId]) { workerCallbacks[requestId]({puzzle, seed}); delete workerCallbacks[requestId]; }
};
function generateAsync(level, seed, callback) {
  const requestId = ++workerRequestId;
  workerCallbacks[requestId] = callback;
  generatorWorker.postMessage({level, seed, requestId});
}
window.addEventListener('beforeunload', () => { generatorWorker.terminate(); URL.revokeObjectURL(workerUrl); });

function initGame(sol,fixed,hints,score,metrics,propRate,problemId){
  curSol=sol; curFixed=fixed; curHints=hints; curScore=score; curMetrics=metrics; curPropRate=propRate; curProblemId=problemId;
  userGrid=Array.from({length:SIZE},()=>Array(SIZE).fill(null));
  isFixed=Array.from({length:SIZE},()=>Array(SIZE).fill(false));
  isFilled=Array.from({length:SIZE},()=>Array(SIZE).fill(false));
  for(const k of Object.keys(fixed)){ const[r,c]=k.split(',').map(Number); isFixed[r][c]=true; userGrid[r][c]=fixed[k]; isFilled[r][c]=true; }
  curRowHints=[]; for(let r=0;r<SIZE;r++)curRowHints.push(getRowDiffSequence(sol,r));
  curColHints=[]; for(let c=0;c<SIZE;c++)curColHints.push(getColDiffSequence(sol,c));
  stepCount=0;mistakeCount=0;logicalChainCount=0;logEntries=[t('logLoad')];errorCells=new Set();
  completed=false;gameReady=true; probIdDisp.innerHTML=`${t('problemIdPrefix')}<span>${problemId}</span>`;
  resetBackup = null; updateLiveStats(); updateStartButton();
}

function resetGame(){
  if(!curSol)return;
  resetTimer(); gameReady=false; completed=false;
  resetBackup={solution:curSol,fixed:curFixed,hints:curHints,score:curScore,metrics:curMetrics,propagateRate:curPropRate,problemId:curProblemId};
  for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++)if(!isFixed[r][c]){userGrid[r][c]=null;isFilled[r][c]=false;}
  errorCells.clear();stepCount=0;mistakeCount=0;logicalChainCount=0;logEntries=[t('logReset')];
  renderAll(); updateStatus(t('statusReset'),'ready');
  updateStartButton(); updateLiveStats();
}

function resumeGame(){
  if(!resetBackup)return;
  initGame(resetBackup.solution,resetBackup.fixed,resetBackup.hints,resetBackup.score,resetBackup.metrics,resetBackup.propagateRate,resetBackup.problemId);
  renderAll(); resetTimer(); startTimer();
  updateStatus(t('statusResume'),'success'); logEntries.push(t('logResume'));
  updateLog();
}

function startGameWithSeed(seed, label){
  if(isGenerating)return;
  resetTimer(); gameReady=false; completed=false; btnStart.disabled=true;
  isGenerating = true; resetBackup = null; updateStartButton();
  updateStatus(t('statusLoading'),'loading'); logEntries.push(t('logGenerate',{label:label,seed:seed}));
  generateAsync(selDiff, seed, (data)=>{
    isGenerating=false;
    if(data.puzzle){
      const id=makeProblemId(selDiff,data.puzzle.seed);
      initGame(data.puzzle.solution,data.puzzle.fixed,data.puzzle.hints,data.puzzle.score,data.puzzle.metrics,data.puzzle.propagateRate,id);
      logEntries.push(t('logGenerated',{id:id})); renderAll(); startTimer();
      updateStatus(t('statusSuccess'),'success');
    }else{
      logEntries.push(t('logGenFail')); updateStatus(t('statusGenFail'),'error'); gameReady=false;
    }
    btnStart.disabled=false; updateStartButton(); updateLog();
  });
}
function startGame(){ const cfg=DIFFICULTY_TABLE[selDiff]; const seed=Math.floor(Math.random()*2147483647); startGameWithSeed(seed, cfg.label); }
function startDailyGame(){ const dailySeed = getDailySeed(); const cfg=DIFFICULTY_TABLE[selDiff]; startGameWithSeed(dailySeed, `📅 ${cfg.label}`); }
function makeProblemId(lvl,seed){ return `v${GENERATOR_VERSION}-${lvl}-${seed}`; }
function parseProblemId(str){ const m=str.match(/^v(\d+\.\d+)-(\d+)-(\d+)$/); if(m)return{version:m[1],level:+m[2],seed:+m[3]}; const old=str.match(/^v(\d+\.\d+)-(\d+)$/); if(old)return{version:old[1],level:null,seed:+old[2]}; return null; }
function loadProblemById(){
  if(isGenerating)return;
  const input=document.getElementById('problemIdInput').value.trim();
  if(!input){updateStatus(t('statusIdError'),'error');return;}
  const parsed=parseProblemId(input);
  if(!parsed){updateStatus(t('statusIdInvalid'),'error');return;}
  const level=parsed.level||selDiff;
  stopTimer(); gameReady=false; completed=false; btnStart.disabled=true;
  isGenerating = true; resetBackup = null; updateStartButton();
  updateStatus(t('statusIdLoading',{id:input}),'loading');
  generateAsync(level, parsed.seed, (data)=>{
    isGenerating=false;
    if(data.puzzle){
      setDifficulty(level); buildDiffButtons();
      const id=makeProblemId(level,data.puzzle.seed);
      initGame(data.puzzle.solution,data.puzzle.fixed,data.puzzle.hints,data.puzzle.score,data.puzzle.metrics,data.puzzle.propagateRate,id);
      logEntries.push(t('logLoadId',{id:input})); renderAll(); resetTimer(); startTimer();
      updateStatus(t('statusIdLoaded',{id:input}),'success');
    }else{
      updateStatus(t('statusIdNotFound'),'error');
      logEntries.push(t('logIdNotFound',{id:input})); gameReady=false; renderAll();
    }
    btnStart.disabled=false; updateStartButton(); updateLog();
  });
}

// ==================== コピー ====================
function copyProblemId(id){
  if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(id).then(()=>showCopyOk()).catch(()=>fallbackCopy(id));
  else fallbackCopy(id);
}
function fallbackCopy(text){ const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.left='-9999px';document.body.appendChild(ta);ta.select(); try{document.execCommand('copy');showCopyOk();}catch(e){prompt(t('copyPrompt'), text);} document.body.removeChild(ta); }
function showCopyOk(){ const btn=document.querySelector('.id-box button'); if(btn){const o=btn.textContent;btn.textContent=t('modalCopyDone');setTimeout(()=>{btn.textContent=o;},1500);} }

// ==================== モーダル ====================
function showFavoritesModal(){
  const favs=getFavorites(); const overlay=createModalOverlay(); const modal=createModal();
  let h=`<h2>${t('modalFavorite')}</h2>`;
  if(favs.length===0) h+=`<p>${t('modalNoFavorites')}</p>`;
  else favs.forEach(id=>{ h+=`<div class="list-item"><span class="info">${id}</span><button class="play-btn">${t('modalPlay')}</button><button class="del-btn">${t('modalDelete')}</button></div>`; });
  h+=`<button class="close-btn">${t('modalClose')}</button>`; modal.innerHTML=h;
  modal.querySelector('.close-btn').addEventListener('click',()=>overlay.remove());
  modal.querySelectorAll('.play-btn').forEach((b,i)=>b.addEventListener('click',()=>{loadFromModal(favs[i]);overlay.remove();}));
  modal.querySelectorAll('.del-btn').forEach((b,i)=>b.addEventListener('click',()=>{removeFavorite(favs[i]);overlay.remove();showFavoritesModal();}));
  overlay.appendChild(modal); document.body.appendChild(overlay);
}
function showHistoryModal(){
  const hist=getHistory(); const overlay=createModalOverlay(); const modal=createModal();
  let h=`<h2>${t('modalHistory')}</h2>`;
  if(hist.length===0) h+=`<p>${t('modalNoHistory')}</p>`;
  else hist.forEach(r=>{ h+=`<div class="list-item"><span class="info">${r.id} (${r.difficulty})<br>${r.time} 🔗${r.chain}/${r.total} ❌${r.mistakes} ${r.grade}</span><button class="play-btn">${t('modalPlay')}</button></div>`; });
  h+=`<button class="close-btn">${t('modalClose')}</button>`; modal.innerHTML=h;
  modal.querySelector('.close-btn').addEventListener('click',()=>overlay.remove());
  modal.querySelectorAll('.play-btn').forEach((b,i)=>b.addEventListener('click',()=>{loadFromModal(hist[i].id);overlay.remove();}));
  overlay.appendChild(modal); document.body.appendChild(overlay);
}
function createModalOverlay(){ const o=document.createElement('div'); o.className='modal-overlay'; o.addEventListener('click',(e)=>{if(e.target===o)o.remove();}); return o; }
function createModal(){ const m=document.createElement('div'); m.className='modal'; return m; }
function loadFromModal(id){ document.getElementById('problemIdInput').value=id; loadProblemById(); }
function removeFavorite(id){ saveFavorites(getFavorites().filter(x=>x!==id)); }

// ==================== 完成処理 ====================
function checkCompletion(){
  if(countFilled()<SIZE*SIZE)return;
  let ok=true; for(let r=0;r<SIZE;r++)if(checkRow(r).length>0){ok=false;break;} if(ok)for(let c=0;c<SIZE;c++)if(checkCol(c).length>0){ok=false;break;}
  if(!ok){updateStatus(t('statusWrong'),'error');return;}
  completed=true;stopTimer(); const time=getTime(),total=stepCount,rate=total>0?logicalChainCount/total:0;
  let ge='',gt='';
  if(mistakeCount===0&&rate>=0.9){ge='🏆';gt='PERFECT!';}else if(mistakeCount===0){ge='🌟';gt='GREAT';}else if(rate>=0.5){ge='👍';gt='GOOD';}else{ge='📝';gt='CLEAR';}
  updateStatus(t('statusComplete',{grade:`${ge} ${gt}`}),'success');
  logEntries.push(t('logComplete',{time:time,chain:logicalChainCount,total:total,mistakes:mistakeCount,grade:gt})); updateLog();
  addHistoryRecord({id:curProblemId,difficulty:DIFFICULTY_TABLE[selDiff]?.label||'?',time,chain:logicalChainCount,total,mistakes:mistakeCount,grade:gt,date:new Date().toISOString()});
  const overlay=createModalOverlay(); const modal=createModal();
  const favClass=isFavorite(curProblemId)?'active':'';
  const logicRate=curMetrics?Math.round(curMetrics.propagateCompleteRate*100):'?';
  const t3c=curMetrics?curMetrics.t3Count:'?'; const maxCh=curMetrics?curMetrics.maxChainLength:'?';
  modal.innerHTML=`
    <h2>${ge}</h2><div class="grade">${gt}</div>
    <div class="detail">${t('modalDetailTime')} <span>${time}</span></div>
    <div class="detail">${t('modalDetailChain')} <span>${logicalChainCount}/${total}</span> (${Math.round(rate*100)}%)</div>
    <div class="detail">${t('modalDetailMistakes')} <span>${mistakeCount}</span></div>
    <div class="detail-stats">${t('modalDetailStats',{logicRate:logicRate,t3:t3c,maxChain:maxCh})}</div>
    <div class="id-box">
      <span>🧩 <strong>${curProblemId}</strong></span>
      <button class="copy-btn">${t('modalCopy')}</button>
      <button class="fav-btn ${favClass}">${isFavorite(curProblemId)?'💔':'❤️'}</button>
    </div>
    <button class="btn-next">${t('modalNext')}</button>
    <button class="close-btn">${t('modalClose')}</button>
  `;
  modal.querySelector('.copy-btn').addEventListener('click',()=>copyProblemId(curProblemId));
  modal.querySelector('.fav-btn').addEventListener('click',function(){ toggleFavorite(curProblemId); this.textContent=isFavorite(curProblemId)?'💔':'❤️'; this.classList.toggle('active',isFavorite(curProblemId)); });
  modal.querySelector('.btn-next').addEventListener('click',()=>{overlay.remove(); startGame();});
  modal.querySelector('.close-btn').addEventListener('click',()=>overlay.remove());
  overlay.appendChild(modal); document.body.appendChild(overlay);
  const cells=gridEl.querySelectorAll('.cell'); cells.forEach((el,i)=>setTimeout(()=>{el.style.background='#d4edda';el.style.transform='scale(1.05)';setTimeout(()=>{el.style.background='';el.style.transform='';},400);},i*30));
}

// ==================== プレイ補助 ====================
function isMoveValid(g,r,c,n){ if(curHints)for(const h of curHints)if((h.r1===r&&h.c1===c)||(h.r2===r&&h.c2===c)){const o=h.r1===r?h.r2:h.r1,o2=h.c1===c?h.c2:h.c1;if(g[o][o2]!==null&&Math.abs(n-g[o][o2])!==h.diff)return false;} const old=g[r][c];g[r][c]=n;const rOk=checkRow(r).length===0,cOk=checkCol(c).length===0;g[r][c]=old;return rOk&&cOk; }
function getCandidateCount(r,c){let n=0;for(const x of NUMBERS)if(isMoveValid(userGrid,r,c,x))n++;return n;}
function handleNumberSelect(r,c,num){
  if(isFixed[r][c]||completed||!gameReady)return;
  if(curHints)for(const h of curHints)if((h.r1===r&&h.c1===c)||(h.r2===r&&h.c2===c)){const o=h.r1===r?h.r2:h.r1,o2=h.c1===c?h.c2:h.c1;if(userGrid[o][o2]!==null&&Math.abs(num-userGrid[o][o2])!==h.diff){mistakeCount++;updateLiveStats();updateStatus(t('statusMistakeAdj',{r:r+1,c:c+1,expected:h.diff}),'error');logEntries.push(t('statusMistakeAdj',{r:r+1,c:c+1,expected:h.diff}));renderAll();updateLog();triggerShake();return;}}
  const old=userGrid[r][c];userGrid[r][c]=num;isFilled[r][c]=true;
  const rE=checkRow(r),cE=checkCol(c);
  if(rE.length||cE.length){userGrid[r][c]=old;isFilled[r][c]=(old!==null);mistakeCount++;updateLiveStats();updateStatus(t('statusMistakeSeq',{r:r+1,c:c+1}),'error');logEntries.push(t('statusMistakeSeq',{r:r+1,c:c+1}));renderAll();updateLog();triggerShake();return;}
  errorCells.delete(`${r},${c}`);
  if(old===null){stepCount++;const cands=getCandidateCount(r,c);if(cands===1)logicalChainCount++;logEntries.push(t('logStep',{step:stepCount,r:r+1,c:c+1,num:num,cands:cands===1?t('logStepChain'):t('logStepMultiple')}));}
  else logEntries.push(t('logEdit',{r:r+1,c:c+1,old:old,new:num}));
  updateLiveStats();renderAll();updateStatus(t('statusInput',{r:r+1,c:c+1,num:num}),'info');checkCompletion();
}
let lpTimer=null,lpTrig=false;
function startLongPress(r,c){ if(!isGenerating&&!isFixed[r][c]&&isFilled[r][c]&&!completed&&gameReady){lpTrig=false;lpTimer=setTimeout(()=>{lpTrig=true;handleDelete(r,c);},600);} }
function cancelLongPress(){ if(lpTimer){clearTimeout(lpTimer);lpTimer=null;} }
function handleDelete(r,c){ if(isFixed[r][c]||!isFilled[r][c]||completed||!gameReady)return; const old=userGrid[r][c];userGrid[r][c]=null;isFilled[r][c]=false;errorCells.delete(`${r},${c}`);logEntries.push(t('logDelete',{r:r+1,c:c+1}));renderAll();updateStatus(t('statusDeleteShort'),'info'); }
function checkRow(r){ const e=[],cur=getRowDiffSequence(userGrid,r),hint=curRowHints[r];for(let i=0;i<cur.length;i++)if(cur[i]!==null&&cur[i]!==hint[i])e.push({c:i,expected:hint[i],actual:cur[i]});return e;}
function checkCol(c){ const e=[],cur=getColDiffSequence(userGrid,c),hint=curColHints[c];for(let i=0;i<cur.length;i++)if(cur[i]!==null&&cur[i]!==hint[i])e.push({r:i,expected:hint[i],actual:cur[i]});return e;}
function countFilled(){let c=0;for(let r=0;r<SIZE;r++)for(let cc=0;cc<SIZE;cc++)if(isFilled[r][cc])c++;return c;}
function updateLiveStats(){liveChain.textContent=logicalChainCount;liveMistakes.textContent=mistakeCount;}
function updateStatus(m,c){statusEl.textContent=m;statusEl.className='status'+(c?' '+c:'');}

// ==================== 分割render ====================
function renderAll(){ renderGrid(); renderStatus(); }
function renderGrid(){
  gridEl.innerHTML='';
  for(let r=0;r<=SIZE;r++)for(let c=0;c<=SIZE;c++){
    const div=document.createElement('div');
    if(r===0&&c===0)div.className='corner';
    else if(r===0){div.className='col-hint';const seq=curColHints[c-1]||[];div.innerHTML=seq.map(d=>`<span>${d}</span>`).join('');}
    else if(c===0){div.className='row-hint';const seq=curRowHints[r-1]||[];div.innerHTML=seq.map(d=>`<span>${d}</span>`).join('');}
    else{
      const ri=r-1,ci=c-1;div.className='cell';div.dataset.r=ri;div.dataset.c=ci;
      const val=userGrid[ri][ci];
      if(isFixed[ri][ci]){div.classList.add('fixed');div.textContent=val;}
      else if(isFilled[ri][ci]){div.classList.add('filled');div.textContent=val;}
      else{div.classList.add('empty');div.textContent='?';}
      if(errorCells.has(`${ri},${ci}`))div.classList.add('error');
      div.addEventListener('click',(e)=>{if(lpTrig){lpTrig=false;return;}showNumberPicker(ri,ci);});
      div.addEventListener('pointerdown',(e)=>{if(e.pointerType==='mouse'&&e.button!==0)return;startLongPress(ri,ci);});
      div.addEventListener('pointerup',cancelLongPress);div.addEventListener('pointercancel',cancelLongPress);div.addEventListener('pointerleave',cancelLongPress);
      div.addEventListener('contextmenu',e=>e.preventDefault());
    }
    gridEl.appendChild(div);
  }
}
function renderStatus(){ updateScoreDisplay();updateDiffLabel();updateLog(); }
function updateScoreDisplay(){
  if(curMetrics){
    scoreBadge.textContent = t('scoreDisplay', {score: Math.max(0,Math.min(1,curScore)).toFixed(3)});
    scoreDisp.textContent = t('scoreDetail', {fixed:curMetrics.fixedCount, density:curMetrics.chainDensity.toFixed(2), t3:curMetrics.t3Count, maxChain:curMetrics.maxChainLength});
  } else { scoreBadge.textContent = t('scoreBadge'); scoreDisp.textContent = ''; }
}
function updateDiffLabel(){
  if(!curMetrics){diffLabel.textContent='';return;}
  const cfg=DIFFICULTY_TABLE[selDiff];
  diffLabel.textContent = t('difficultyLabelText', {stars:cfg.label, fixed:cfg.fixedCount});
}
function updateLog(){ const html=logEntries.map(e=>{if(e.includes('Step')||e.includes('Chain'))return`<div class="event-fix">• ${e}</div>`;if(e.includes('✨')||e.includes('Generated'))return`<div class="event-gen">• ${e}</div>`;if(e.includes('❌')||e.includes('invalid')||e.includes('mismatch'))return`<div class="event-error">• ${e}</div>`;if(e.includes('✅')||e.includes('Started'))return`<div class="event-info">• ${e}</div>`;if(e.includes('🗑️')||e.includes('deleted'))return`<div class="event-delete">• ${e}</div>`;if(e.includes('🔍')||e.includes('Checked'))return`<div class="event-check">• ${e}</div>`;return`• ${e}`;}).join('');logEl.innerHTML=html;logEl.scrollTop=logEl.scrollHeight;}
function showHint(){ if(!curSol||completed||!gameReady)return; for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++){if(isFilled[r][c])continue;const cands=NUMBERS.filter(n=>isMoveValid(userGrid,r,c,n));if(cands.length===1){const cell=gridEl.querySelector(`.cell[data-r="${r}"][data-c="${c}"]`);if(cell){cell.classList.add('hint-glow');setTimeout(()=>cell.classList.remove('hint-glow'),1500);}updateStatus(t('statusHint',{r:r+1,c:c+1,num:cands[0]}),'info');return;}}updateStatus(t('statusNoHint'),'info');}
function checkPartial(){ let err=false;errorCells.clear();for(let r=0;r<SIZE;r++){const re=checkRow(r);for(const e of re){errorCells.add(`${r},${e.c}`);err=true;}}for(let c=0;c<SIZE;c++){const ce=checkCol(c);for(const e of ce){errorCells.add(`${e.r},${c}`);err=true;}}renderAll(); if(err){updateStatus(t('statusCheckError'),'error');logEntries.push(t('logCheck',{count:errorCells.size}));}else{const f=countFilled();if(f===SIZE*SIZE)checkCompletion();else updateStatus(t('statusCheckOk',{filled:f,total:SIZE*SIZE}),'info');}updateLog();}

// ==================== NumberPicker ====================
let pickerOv=null,pickerEl=null;
function removePicker(){if(pickerOv){pickerOv.remove();pickerOv=null;}if(pickerEl){pickerEl.remove();pickerEl=null;}}
function showNumberPicker(r,c){
  if(isGenerating||isFixed[r][c]||completed||!gameReady)return;
  removePicker();const cellEl=gridEl.querySelector(`.cell[data-r="${r}"][data-c="${c}"]`);if(!cellEl)return;
  const rect=cellEl.getBoundingClientRect();let cx=rect.left+rect.width/2,cy=rect.top+rect.height/2;
  cx=Math.min(Math.max(cx,120),window.innerWidth-120);cy=Math.min(Math.max(cy,140),window.innerHeight-140);
  pickerOv=document.createElement('div');pickerOv.className='picker-overlay';pickerOv.addEventListener('click',removePicker);document.body.appendChild(pickerOv);
  pickerEl=document.createElement('div');pickerEl.className='number-picker';pickerEl.style.left=cx+'px';pickerEl.style.top=cy+'px';
  for(const num of[1,2,3,4,5,6]){const btn=document.createElement('button');btn.className='picker-btn';btn.textContent=num;btn.addEventListener('click',(e)=>{e.stopPropagation();handleNumberSelect(r,c,num);removePicker();});pickerEl.appendChild(btn);}
  const closeBtn=document.createElement('button');closeBtn.className='picker-close';closeBtn.textContent='✕';closeBtn.addEventListener('click',(e)=>{e.stopPropagation();removePicker();});pickerEl.appendChild(closeBtn);
  document.body.appendChild(pickerEl);
}

// ==================== 言語切り替え ====================
function switchLanguage(lang) {
  currentLang = lang;
  applyStaticTranslations();
  updateStartButton();
  if (curSol) {
    probIdDisp.innerHTML = `${t('problemIdPrefix')}<span>${curProblemId}</span>`;
    updateScoreDisplay(); updateDiffLabel(); updateLog();
  } else {
    updateStatus(t('statusReady'), 'ready');
    logEntries=[t('logReady')]; updateLog();
  }
  langJaBtn.classList.toggle('active', lang==='ja');
  langEnBtn.classList.toggle('active', lang==='en');
}

// ==================== 初期化 ====================
function init(){
  const settings=getSettings(); selDiff=settings.difficulty||3;
  buildDiffButtons(); setDifficulty(selDiff);

  curSol=null;curFixed=null;curHints=null;curRowHints=[];curColHints=[];
  userGrid=Array.from({length:SIZE},()=>Array(SIZE).fill(null));
  isFixed=Array.from({length:SIZE},()=>Array(SIZE).fill(false));
  isFilled=Array.from({length:SIZE},()=>Array(SIZE).fill(false));
  stepCount=0;mistakeCount=0;logicalChainCount=0;completed=false;gameReady=false;
  curProblemId=null;probIdDisp.innerHTML='';
  resetTimer();updateLiveStats();applyStaticTranslations();renderAll();
  updateStatus(t('statusReady'),'ready');
  logEntries=[t('logReady')];updateLog();

  document.getElementById('btnHint').addEventListener('click',showHint);
  document.getElementById('btnCheck').addEventListener('click',checkPartial);
  document.getElementById('btnReset').addEventListener('click',resetGame);
  document.getElementById('btnLoadId').addEventListener('click',loadProblemById);
  document.getElementById('btnFavorites').addEventListener('click',showFavoritesModal);
  document.getElementById('btnHistory').addEventListener('click',showHistoryModal);
  document.getElementById('btnDaily').addEventListener('click',startDailyGame);
  langJaBtn.addEventListener('click',()=>switchLanguage('ja'));
  langEnBtn.addEventListener('click',()=>switchLanguage('en'));

  updateStartButton();
}
init();
</script>
